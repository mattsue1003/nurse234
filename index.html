<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>極限聯想倒數挑戰 - 終極懸疑版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        :root {
            --primary-cyan: #22d3ee;
            --urgent-red: #f43f5e;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            overflow: hidden;
            height: 100dvh;
            margin: 0;
            touch-action: manipulation;
        }

        .timer-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .timer-path {
            fill: none;
            stroke: var(--primary-cyan);
            stroke-width: 12;
            stroke-linecap: round;
            filter: drop-shadow(0 0 8px #0891b2);
            transition: stroke-dashoffset 0.1s linear, stroke 0.3s ease, filter 0.3s ease;
        }

        .urgent .timer-path {
            stroke: var(--urgent-red);
            filter: drop-shadow(0 0 15px #e11d48);
            animation: pulse-border 0.5s infinite alternate;
        }

        @keyframes pulse-border {
            from { opacity: 1; stroke-width: 12; }
            to { opacity: 0.8; stroke-width: 16; }
        }

        .urgent #timer-text {
            animation: pulse-text 0.5s infinite alternate;
        }

        @keyframes pulse-text {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .question-box {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #main-container {
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.2), border-color 0.2s ease;
        }

        .shake {
            animation: shake-anim 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake-anim {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        input[type=range] { accent-color: var(--primary-cyan); }
        .no-select { user-select: none; -webkit-user-select: none; }
        
        .long-text { font-size: clamp(2.5rem, 10vw, 6rem) !important; text-align: center; }

        .designer-tag {
            position: fixed;
            bottom: 8px;
            right: 12px;
            font-size: 10px;
            color: rgba(148, 163, 184, 0.5);
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>

    <script>
        // Web Audio API 實體合成音效 (消除資源載入延遲，保證百分之百發聲與極致反饋)
        class SoundSynth {
            constructor() {
                this.ctx = null;
            }
            
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            
            // 清脆的時鐘滴答聲 (木質打擊感)
            playTick() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const vol = parseFloat(document.getElementById('sfx-volume').value) / 100;
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.05);
                
                gain.gain.setValueAtTime(vol * 0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.06);
            }
            
            // 逼真、帶有壓迫重低音的心跳聲 (咚咚！)
            playHeartbeat() {
                this.init();
                const now = this.ctx.currentTime;
                const vol = parseFloat(document.getElementById('sfx-volume').value) / 100;
                
                const beat = (timeOffset, pitch) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(pitch, now + timeOffset);
                    osc.frequency.exponentialRampToValueAtTime(20, now + timeOffset + 0.15);
                    
                    gain.gain.setValueAtTime(vol * 0.9, now + timeOffset);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + timeOffset + 0.15);
                    
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + timeOffset);
                    osc.stop(now + timeOffset + 0.16);
                };
                
                // 第一下 (Lub)
                beat(0, 55);
                // 第二下 (Dub)
                beat(0.12, 48);
            }

            // 勝利凱旋鈴聲 (大調漸進鐘琴音效)
            playSuccess() {
                this.init();
                const now = this.ctx.currentTime;
                const vol = parseFloat(document.getElementById('sfx-volume').value) / 100;
                
                const playTone = (freq, start, duration, delay) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + delay);
                    osc.frequency.linearRampToValueAtTime(freq * 1.01, now + delay + duration);
                    
                    gain.gain.setValueAtTime(0, now + delay);
                    gain.gain.linearRampToValueAtTime(vol * 0.3, now + delay + 0.04);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + delay + duration);
                    
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + delay);
                    osc.stop(now + delay + duration);
                };
                
                playTone(261.63, 0.3, 0.4, 0);       // C4
                playTone(329.63, 0.3, 0.4, 0.08);    // E4
                playTone(392.00, 0.3, 0.4, 0.16);    // G4
                playTone(523.25, 0.6, 0.8, 0.24);    // C5
                playTone(659.25, 0.8, 1.0, 0.32);    // E5
            }
            
            // 悲慘、低沈的時間到警報 (雙聲道鋸齒波大喇叭)
            playFail() {
                this.init();
                const now = this.ctx.currentTime;
                const vol = parseFloat(document.getElementById('sfx-volume').value) / 100;
                
                const playBuzz = (freq, delay, duration) => {
                    const osc1 = this.ctx.createOscillator();
                    const osc2 = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    
                    osc1.type = 'sawtooth';
                    osc2.type = 'sawtooth';
                    
                    osc1.frequency.setValueAtTime(freq, now + delay);
                    osc2.frequency.setValueAtTime(freq * 1.015, now + delay);
                    
                    osc1.frequency.linearRampToValueAtTime(freq * 0.5, now + delay + duration);
                    osc2.frequency.linearRampToValueAtTime(freq * 0.5 * 1.015, now + delay + duration);
                    
                    gain.gain.setValueAtTime(vol * 0.35, now + delay);
                    gain.gain.linearRampToValueAtTime(vol * 0.35, now + delay + duration - 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + delay + duration);
                    
                    osc1.connect(gain);
                    osc2.connect(gain);
                    gain.connect(this.ctx.destination);
                    
                    osc1.start(now + delay);
                    osc2.start(now + delay);
                    osc1.stop(now + delay + duration);
                    osc2.stop(now + delay + duration);
                };
                
                playBuzz(110, 0, 0.9);
            }
            
            // 開始挑戰時的高音爬升音效 (Riser)
            playRiser() {
                this.init();
                const now = this.ctx.currentTime;
                const vol = parseFloat(document.getElementById('sfx-volume').value) / 100;
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 1.2);
                
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(vol * 0.3, now + 0.6);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 1.2);
            }
        }

        const soundSynth = new SoundSynth();

        // 基礎變數設定
        let duration = 10;
        let originalQuestions = [];
        let pool = []; 
        let currentIdx = -1;
        let timerInterval = null;
        let timeLeft = 10;
        let isRunning = false;
        let currentTargetNum = 5;
        let lastIntSecond = -1;
        let player; 
        let isTestingBgm = false;

        // 嵌入 YouTube API 控制緊張 BGM
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            const videoId = document.getElementById('bgm-theme').value;
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                videoId: videoId, 
                playerVars: { 'autoplay': 0, 'controls': 0, 'loop': 1, 'playlist': videoId },
                events: {
                    'onReady': () => updateBgmVolume()
                }
            });
        }

        const setupScreen = document.getElementById('setup-screen');
        const gameScreen = document.getElementById('game-screen');
        const questionInput = document.getElementById('question-input');
        const questionDisplay = document.getElementById('question-display');
        const timerText = document.getElementById('timer-text');
        const timerPath = document.getElementById('timer-path');
        const qProgress = document.getElementById('q-progress');
        const mainContainer = document.getElementById('main-container');
        const startBtn = document.getElementById('start-btn');
        const finishBtn = document.getElementById('finish-btn');
        const nextBtn = document.getElementById('next-btn');
        const resetBtn = document.getElementById('reset-btn');
        const bgmVolumeInput = document.getElementById('bgm-volume');
        const sfxVolumeInput = document.getElementById('sfx-volume');
        const targetNumSpan = document.getElementById('target-num');

        bgmVolumeInput.addEventListener('input', updateBgmVolume);
        sfxVolumeInput.addEventListener('input', () => {
            soundSynth.playTick(); // 即時聲音大小回饋
        });
        
        function updateBgmVolume() {
            if (player && player.setVolume) player.setVolume(bgmVolumeInput.value);
        }

        function toggleTargetUI() {
            const mode = document.getElementById('target-mode').value;
            document.getElementById('fixed-ui').classList.toggle('hidden', mode !== 'fixed');
            document.getElementById('range-ui').classList.toggle('hidden', mode === 'fixed');
        }

        // 當使用者切換風格時，直接重新載入 YouTube 撥放器的影片 ID
        function changeBgmTheme() {
            const videoId = document.getElementById('bgm-theme').value;
            if (player && player.loadVideoById) {
                player.loadVideoById({
                    videoId: videoId,
                    startSeconds: 0
                });
                // 停止試聽或自動預備
                setTimeout(() => {
                    player.pauseVideo();
                }, 350);
            }
        }

        // 試聽音樂
        function testBgm() {
            if (!player) return;
            soundSynth.init();
            const testBtn = document.getElementById('test-bgm-btn');
            if (!isTestingBgm) {
                isTestingBgm = true;
                testBtn.innerText = "停止";
                testBtn.classList.remove('bg-slate-700');
                testBtn.classList.add('bg-rose-600');
                if (player.playVideo) {
                    player.seekTo(0);
                    player.playVideo();
                }
            } else {
                isTestingBgm = false;
                testBtn.innerText = "試聽";
                testBtn.classList.add('bg-slate-700');
                testBtn.classList.remove('bg-rose-600');
                if (player.pauseVideo) {
                    player.pauseVideo();
                }
            }
        }

        // 試聽系統音效
        function testSfx() {
            soundSynth.init();
            soundSynth.playSuccess();
        }

        // 更新外圍計時框 SVG 形狀與長度
        function updatePath() {
            const w = mainContainer.offsetWidth;
            const h = mainContainer.offsetHeight;
            const r = window.innerWidth < 640 ? 40 : 64; 
            const sw = 12; 
            const offset = sw / 2 + 2;

            const d = `
                M ${offset + r},${offset}
                L ${w - offset - r},${offset}
                A ${r},${r} 0 0 1 ${w - offset},${offset + r}
                L ${w - offset},${h - offset - r}
                A ${r},${r} 0 0 1 ${w - offset - r},${h - offset}
                L ${offset + r},${h - offset}
                A ${r},${r} 0 0 1 ${offset},${h - offset - r}
                L ${offset},${offset + r}
                A ${r},${r} 0 0 1 ${offset + r},${offset}
                Z
            `;
            timerPath.setAttribute('d', d);
            const length = timerPath.getTotalLength();
            timerPath.style.strokeDasharray = length;
            timerPath.style.strokeDashoffset = 0;
            return length;
        }

        function setDuration(sec) {
            duration = parseFloat(sec) || 10;
            timeLeft = duration;
            timerText.innerText = timeLeft.toFixed(1) + 's';
            document.querySelectorAll('.duration-btn').forEach(btn => {
                btn.classList.toggle('bg-cyan-600', parseFloat(btn.dataset.sec) === duration);
            });
        }

        function startGame() {
            const input = questionInput.value.trim();
            if (!input) return;
            soundSynth.init();
            originalQuestions = input.split('\n').filter(q => q.trim() !== "");
            initPool();
            setupScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            
            // 自動撥放選定的背景音樂，立刻拉滿遊戲氛圍
            if (player && player.playVideo) {
                player.seekTo(0);
                player.playVideo();
            }
            
            nextQuestion();
        }

        function initPool() {
            const isRandom = document.querySelector('input[name="order"]:checked').value === 'random';
            pool = Array.from({length: originalQuestions.length}, (_, i) => i);
            if (isRandom) {
                for (let i = pool.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [pool[i], pool[j]] = [pool[j], pool[i]];
                }
            }
        }

        function nextQuestion() {
            const canRepeat = document.getElementById('repeat-toggle').checked;
            if (pool.length === 0) initPool();
            const qIdx = pool.shift();
            currentIdx = qIdx;
            if (canRepeat) {
                const pos = Math.floor(Math.random() * (pool.length + 1));
                pool.splice(pos, 0, qIdx);
            }
            resetCurrent();
        }

        function resetCurrent() {
            clearInterval(timerInterval);
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            isRunning = false;
            timeLeft = duration;
            lastIntSecond = -1;
            mainContainer.classList.remove('time-up', 'shake', 'urgent', 'scale-[1.03]');
            
            const qText = originalQuestions[currentIdx];
            questionDisplay.innerText = qText;
            
            if (qText.length > 5) {
                questionDisplay.classList.add('long-text');
            } else {
                questionDisplay.classList.remove('long-text');
            }
            
            const total = originalQuestions.length;
            const current = originalQuestions.indexOf(originalQuestions[currentIdx]) + 1;
            qProgress.innerText = `${current} / ${total}`;
            
            const mode = document.getElementById('target-mode').value;
            if (mode === 'range') {
                const min = parseInt(document.getElementById('target-min').value) || 3;
                const max = parseInt(document.getElementById('target-max').value) || 5;
                currentTargetNum = Math.floor(Math.random() * (max - min + 1)) + min;
            } else {
                currentTargetNum = parseInt(document.getElementById('target-fixed').value) || 5;
            }
            targetNumSpan.innerText = currentTargetNum;

            startBtn.classList.remove('hidden');
            finishBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
            resetBtn.classList.add('hidden');
            
            timerText.innerText = timeLeft.toFixed(1) + 's';
            timerText.classList.remove('text-rose-500');
            timerText.classList.add('text-cyan-400');

            updatePath();
            timerPath.style.transition = 'none';
            timerPath.style.strokeDashoffset = 0;
            
            // 讓背景音樂在準備與轉場時持續播放，維持高張力，不中斷
            if (player && player.playVideo && player.getPlayerState() !== 1) {
                player.playVideo();
            }
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            soundSynth.init();
            
            // 播放熱血開場 Riser 音效
            soundSynth.playRiser();

            startBtn.classList.add('hidden');
            finishBtn.classList.remove('hidden');
            
            if(player && player.playVideo) {
                player.playVideo();
            }

            const length = updatePath();
            timerPath.style.transition = `stroke-dashoffset ${duration}s linear`;
            timerPath.style.strokeDashoffset = length;

            const startTime = Date.now();
            const endTime = startTime + (duration * 1000);

            timerInterval = setInterval(() => {
                const now = Date.now();
                const diff = endTime - now;
                
                if (diff <= 0) {
                    finishTimer(false);
                } else {
                    timeLeft = diff / 1000;
                    timerText.innerText = timeLeft.toFixed(1) + 's';
                    const secInt = Math.ceil(timeLeft);

                    // 倒數 5 秒內觸發「極度緊張」視覺與聽覺震盪
                    if (timeLeft <= 5.0) {
                        mainContainer.classList.add('urgent');
                        timerText.classList.add('text-rose-500');
                        timerText.classList.remove('text-cyan-400');
                        
                        if (secInt !== lastIntSecond) {
                            speakNumber(secInt);
                            soundSynth.playHeartbeat(); // 強烈心跳聲
                            triggerVisualPulse();      // 畫面心跳脈搏同步縮放
                            lastIntSecond = secInt;
                        }
                    } else {
                        // 正常時間滴答聲
                        if (secInt !== lastIntSecond) {
                            soundSynth.playTick();
                            lastIntSecond = secInt;
                        }
                    }
                }
            }, 50);
        }

        // 畫面與心跳聲同步的收縮震撼感
        function triggerVisualPulse() {
            mainContainer.classList.add('scale-[1.03]');
            setTimeout(() => {
                mainContainer.classList.remove('scale-[1.03]');
            }, 150);
        }

        // 語音播報
        function speakNumber(num) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(num.toString());
            utterance.lang = 'zh-TW';
            utterance.rate = 1.6;
            utterance.volume = parseFloat(document.getElementById('sfx-volume').value) / 100;
            window.speechSynthesis.speak(utterance);
        }

        function finishTimer(isEarly) {
            clearInterval(timerInterval);
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            isRunning = false;
            finishBtn.classList.add('hidden');
            nextBtn.classList.remove('hidden');
            resetBtn.classList.remove('hidden');
            mainContainer.classList.remove('urgent', 'scale-[1.03]');
            
            if (isEarly) {
                const length = timerPath.getTotalLength();
                timerPath.style.transition = 'stroke-dashoffset 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                timerPath.style.strokeDashoffset = length;
                soundSynth.playSuccess(); // 播放終極勝利和弦音效
            } else {
                timeLeft = 0;
                timerText.innerText = '0.0s';
                mainContainer.classList.add('time-up', 'shake');
                soundSynth.playFail();    // 播放爆烈失敗警報音效
            }
            
            // 答題結束時保持背景音樂連續播放，維持全場熱絡氛圍（不調用 pauseVideo）
            
            // 還原試聽狀態
            if (isTestingBgm) {
                isTestingBgm = false;
                const testBtn = document.getElementById('test-bgm-btn');
                if (testBtn) {
                    testBtn.innerText = "試聽";
                    testBtn.classList.add('bg-slate-700');
                    testBtn.classList.remove('bg-rose-600');
                }
            }
        }

        function backToSetup() {
            clearInterval(timerInterval);
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            isRunning = false;
            
            // 回到設定頁面時，將背景音樂暫停
            if(player && player.pauseVideo) player.pauseVideo();
            
            if (isTestingBgm) {
                isTestingBgm = false;
                const testBtn = document.getElementById('test-bgm-btn');
                if (testBtn) {
                    testBtn.innerText = "試聽";
                    testBtn.classList.add('bg-slate-700');
                    testBtn.classList.remove('bg-rose-600');
                }
            }

            gameScreen.classList.add('hidden');
            setupScreen.classList.remove('hidden');
        }

        // 鍵盤空白鍵與快捷鍵控制
        window.addEventListener('keydown', (e) => {
            if (gameScreen.classList.contains('hidden')) return;
            if (e.code === 'Space') {
                e.preventDefault();
                if (!isRunning && !startBtn.classList.contains('hidden')) startTimer();
                else if (isRunning && !finishBtn.classList.contains('hidden')) finishTimer(true);
                else if (!isRunning && !nextBtn.classList.contains('hidden')) nextQuestion();
            }
            if (e.code === 'KeyR') resetCurrent();
        });

        // 畫面重整保持倒數線比例正確
        window.addEventListener('resize', () => {
            if (!gameScreen.classList.contains('hidden')) {
                updatePath();
                if (!isRunning) timerPath.style.strokeDashoffset = 0;
            }
        });

        // 初始化秒數
        setDuration(10);
    </script>
</body>
</html>
